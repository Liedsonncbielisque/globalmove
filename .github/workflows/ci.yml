name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint
      
      - name: Build Frontend
        run: |
          cd frontend
          npm run build
      
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci
      
      - name: Lint Backend
        run: |
          cd backend
          npm run lint
      
      - name: Build Backend
        run: |
          cd backend
          npm run build
      
      - name: Run Tests
        run: |
          cd backend
          npm test